# phone-use-harmonyos Configuration (device path: /data/local/.phone-use-harmonyos/phone-use-harmonyos.conf)
# GLM API Key (required) — from https://open.bigmodel.cn/
GLM_API_KEY=YOUR_API_KEY

# GLM API Endpoint (optional, default shown)
GLM_ENDPOINT=https://open.bigmodel.cn/api/paas/v4/chat/completions

# GLM Model (optional, default shown)
GLM_MODEL=autoglm-phone
